<!-- Wklej style minigierki do sekcji <style> -->
<style>
  .game-section {
    max-width: 1060px;
    margin: 0 auto 72px;
    padding: 0 24px;
  }
  .game-box {
    background-color: #16111c;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 28px 20px;
    text-align: center;
  }
  .game-box h2 {
    font-size: 1.4rem;
    margin-bottom: 8px;
  }
  .game-sub {
    color: #c2bacd;
    font-size: 0.92rem;
    margin-bottom: 18px;
  }
  .game-hud {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    font-size: 0.9rem;
    color: #e6e1ec;
  }
  .game-hud strong {
    color: #ff2a85;
  }
  .game-reset {
    background: #231b2b;
    color: #ffffff;
    border: 1px solid rgba(255, 42, 133, 0.4);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background-color 0.2s ease, transform 0.15s ease;
  }
  .game-reset:hover {
    background: #e6277a;
    transform: translateY(-1px);
  }
  .game-board {
    display: inline-grid;
    grid-template-columns: repeat(7, 42px);
    gap: 4px;
    background: #0e0a12;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .cell {
    width: 42px;
    height: 42px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.8rem;
    user-select: none;
  }
  .cell-floor {
    background: #1a1422;
  }
  .cell-wall {
    background: #2c2238;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .cell-goal {
    background: rgba(255, 42, 133, 0.14);
    border: 1px dashed #ff2a85;
    color: #ff2a85;
    font-size: 0.65rem;
  }
  .cell-case {
    background: #2b1829;
    border: 2px solid #ff2a85;
    color: #ffffff;
    box-shadow: 0 0 10px rgba(255, 42, 133, 0.25);
  }
  .cell-case-done {
    background: #163326;
    border: 2px solid #38d996;
    color: #9bf6cc;
  }
  .cell-player {
    background: #ff2a85;
    color: #0e0a12;
    box-shadow: 0 0 12px rgba(255, 42, 133, 0.5);
  }
  .game-controls {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .dpad-row {
    display: flex;
    gap: 8px;
  }
  .dpad-btn {
    width: 44px;
    height: 40px;
    background: #231b2b;
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
  }
  .dpad-btn:active {
    background: #ff2a85;
    color: #0e0a12;
  }
  .game-status {
    margin-top: 14px;
    min-height: 24px;
    font-weight: 600;
    color: #38d996;
    font-size: 0.95rem;
  }
  @media (max-width: 420px) {
    .game-board {
      grid-template-columns: repeat(7, 36px);
    }
    .cell {
      width: 36px;
      height: 36px;
    }
  }
</style>

<!-- Wklej sekcję gry w <body> (np. nad sekcją #kontakt) -->
<section class="game-section" id="minigra">
  <div class="game-box">
    <h2>Stagehand Challenge: Wepchnij case na strefę</h2>
    <p class="game-sub">Użyj strzałek na klawiaturze lub przycisków poniżej, aby dopchać skrzynię (<strong>CASE</strong>) do oznaczonego punktu (<strong>CEL</strong>).</p>

    <div class="game-hud">
      <div>Ruchy: <strong id="moveCount">0</strong></div>
      <button type="button" class="game-reset" id="resetGameBtn">Resetuj planszę</button>
    </div>

    <div class="game-board" id="gameBoard" role="grid" aria-label="Plansza gry w pchanie case'a"></div>

    <div class="game-controls" aria-label="Sterowanie dotykowe">
      <div class="dpad-row">
        <button type="button" class="dpad-btn" data-dir="up" aria-label="W górę">▲</button>
      </div>
      <div class="dpad-row">
        <button type="button" class="dpad-btn" data-dir="left" aria-label="W lewo">◀</button>
        <button type="button" class="dpad-btn" data-dir="down" aria-label="W dół">▼</button>
        <button type="button" class="dpad-btn" data-dir="right" aria-label="W prawo">▶</button>
      </div>
    </div>

    <div class="game-status" id="gameStatus"></div>
  </div>
</section>

<script>
(function () {
  // # = przeszkoda/ściana, . = podłoga, G = cel (strefa), P = ludzik, C = case
  const initialMap = [
    "#######",
    "#..G..#",
    "#..#..#",
    "#..C..#",
    "#..P..#",
    "#.....#",
    "#######"
  ];

  const boardEl = document.getElementById("gameBoard");
  const moveEl = document.getElementById("moveCount");
  const statusEl = document.getElementById("gameStatus");
  const resetBtn = document.getElementById("resetGameBtn");

  let walls = new Set();
  let goals = new Set();
  let cases = new Set();
  let player = { r: 0, c: 0 };
  let moves = 0;
  let won = false;

  const key = (r, c) => `${r},${c}`;

  function initGame() {
    walls.clear();
    goals.clear();
    cases.clear();
    moves = 0;
    won = false;
    moveEl.textContent = "0";
    statusEl.textContent = "";

    for (let r = 0; r < initialMap.length; r++) {
      for (let c = 0; c < initialMap[r].length; c++) {
        const ch = initialMap[r][c];
        if (ch === "#") walls.add(key(r, c));
        if (ch === "G") goals.add(key(r, c));
        if (ch === "C") cases.add(key(r, c));
        if (ch === "P") player = { r, c };
      }
    }
    render();
  }

  function render() {
    boardEl.innerHTML = "";
    for (let r = 0; r < initialMap.length; r++) {
      for (let c = 0; c < initialMap[r].length; c++) {
        const k = key(r, c);
        const cell = document.createElement("div");
        cell.className = "cell";

        if (walls.has(k)) {
          cell.classList.add("cell-wall");
          cell.textContent = "■";
        } else if (player.r === r && player.c === c) {
          cell.classList.add("cell-player");
          cell.textContent = "OPS";
        } else if (cases.has(k)) {
          cell.classList.add("cell-case");
          if (goals.has(k)) cell.classList.add("cell-case-done");
          cell.textContent = "CASE";
        } else if (goals.has(k)) {
          cell.classList.add("cell-goal");
          cell.textContent = "CEL";
        } else {
          cell.classList.add("cell-floor");
        }
        boardEl.appendChild(cell);
      }
    }
  }

  function move(dir) {
    if (won) return;
    const deltas = {
      up: [-1, 0],
      down: [1, 0],
      left: [0, -1],
      right: [0, 1]
    };
    const [dr, dc] = deltas[dir] || [0, 0];
    const nr = player.r + dr;
    const nc = player.c + dc;
    const nk = key(nr, nc);

    if (walls.has(nk)) return;

    if (cases.has(nk)) {
      const br = nr + dr;
      const bc = nc + dc;
      const bk = key(br, bc);
      if (walls.has(bk) || cases.has(bk)) return;
      cases.delete(nk);
      cases.add(bk);
    }

    player = { r: nr, c: nc };
    moves += 1;
    moveEl.textContent = String(moves);

    if ([...cases].every((ck) => goals.has(ck))) {
      won = true;
      statusEl.textContent = `Case dostarczony w ${moves} ruchach! Dobra robota na scenie.`;
    }
    render();
  }

  document.addEventListener("keydown", (e) => {
    const map = {
      ArrowUp: "up",
      ArrowDown: "down",
      ArrowLeft: "left",
      ArrowRight: "right"
    };
    if (map[e.key]) {
      e.preventDefault();
      move(map[e.key]);
    }
  });

  document.querySelectorAll(".dpad-btn").forEach((btn) => {
    btn.addEventListener("click", () => move(btn.dataset.dir));
  });

  resetBtn.addEventListener("click", initGame);
  initGame();
})();
</script>
