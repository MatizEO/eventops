<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>event_ops — Stagehand, Technicy, Riggerzy | Kraków</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0e0a12;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 42, 133, 0.7); }
            50% { transform: scale(1.15); box-shadow: 0 0 0 8px rgba(255, 42, 133, 0); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1060px;
            margin: 0 auto;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .brand-text {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            color: #ffffff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: color 0.25s ease, transform 0.25s ease;
        }
        .brand-text:hover {
            color: #ff2a85;
            transform: translateY(-1px);
        }

        nav {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            font-size: 0.85rem;
            letter-spacing: 1.4px;
        }
        nav a {
            position: relative;
            color: #dcd6e5;
            text-decoration: none;
            text-transform: uppercase;
            padding-bottom: 4px;
            transition: color 0.25s ease;
        }
        nav a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 2px;
            background-color: #ff2a85;
            transition: width 0.25s ease;
        }
        nav a:hover { color: #ffffff; }
        nav a:hover::after { width: 100%; }

        .hero {
            max-width: 880px;
            margin: 0 auto;
            padding: 76px 24px 64px;
            text-align: center;
            animation: fadeUp 0.7s ease-out both;
        }
        .hero-logo {
            max-width: 100%;
            max-height: 130px;
            width: auto;
            height: auto;
            margin: 0 auto 24px;
            display: block;
            transition: transform 0.35s ease, filter 0.35s ease;
        }
        .hero-logo:hover {
            transform: scale(1.03);
            filter: drop-shadow(0 0 18px rgba(255, 42, 133, 0.28));
        }
        .role-bar {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #ff2a85;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff2a85;
            display: inline-block;
            animation: pulseDot 2s infinite;
        }
        .hero h1 {
            font-size: 1.95rem;
            font-weight: 700;
            max-width: 740px;
            margin: 0 auto 18px;
        }
        .hero p {
            color: #cfc8d8;
            font-size: 1.08rem;
            max-width: 640px;
            margin: 0 auto 28px;
        }

        .carry-scene {
            max-width: 440px;
            margin: 0 auto 28px;
            padding: 12px 16px;
            background: rgba(22, 17, 28, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }
        .carry-svg {
            width: 100%;
            height: 136px;
            display: block;
        }
        .carrier-group { animation: stairClimb 3.2s linear infinite; }
        .leg-left {
            transform-box: fill-box;
            transform-origin: center top;
            animation: stepLeft 0.4s ease-in-out infinite;
        }
        .leg-right {
            transform-box: fill-box;
            transform-origin: center top;
            animation: stepRight 0.4s ease-in-out infinite;
        }

        @keyframes stairClimb {
            0% { opacity: 0; transform: translate(0px, 0px); }
            10% { opacity: 1; transform: translate(15px, 0px); }
            25% { transform: translate(45px, 0px); }
            35% { transform: translate(65px, -18px); }
            50% { transform: translate(95px, -18px); }
            60% { transform: translate(115px, -36px); }
            75% { transform: translate(145px, -36px); }
            85% { opacity: 1; transform: translate(165px, -54px); }
            95% { opacity: 1; transform: translate(190px, -54px); }
            100% { opacity: 0; transform: translate(200px, -54px); }
        }
        @keyframes stepLeft {
            0%, 100% { transform: rotate(22deg); }
            50% { transform: rotate(-18deg); }
        }
        @keyframes stepRight {
            0%, 100% { transform: rotate(-18deg); }
            50% { transform: rotate(22deg); }
        }

        .cta-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
        }
        .btn {
            display: inline-block;
            padding: 13px 26px;
            background-color: #e6277a;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.25s ease;
        }
        .btn:hover {
            background-color: #ff2a85;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 42, 133, 0.35);
        }
        .btn:active { transform: translateY(0); }

        .btn-secondary {
            display: inline-block;
            padding: 13px 24px;
            background-color: transparent;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.25s ease;
        }
        .btn-secondary:hover {
            border-color: #ff2a85;
            color: #ff2a85;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 42, 133, 0.14);
        }
        .btn-secondary:active { transform: translateY(0); }

        .offer {
            max-width: 1060px;
            margin: 0 auto;
            padding: 20px 24px 72px;
            animation: fadeUp 0.8s ease-out 0.15s both;
        }
        .offer h2 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 32px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }
