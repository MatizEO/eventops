<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>event_ops — Stagehand, Technicy, Riggerzy | Kraków</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0e0a12;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 42, 133, 0.7); }
            50% { transform: scale(1.15); box-shadow: 0 0 0 8px rgba(255, 42, 133, 0); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1060px;
            margin: 0 auto;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .brand-logo {
            height: 42px;
            width: auto;
            display: block;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }
        .brand-logo:hover { transform: scale(1.04); }

        nav {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            font-size: 0.85rem;
            letter-spacing: 1.4px;
        }
        nav a {
            position: relative;
            color: #dcd6e5;
            text-decoration: none;
            text-transform: uppercase;
            padding-bottom: 4px;
            transition: color 0.25s ease;
        }
        nav a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 2px;
            background-color: #ff2a85;
            transition: width 0.25s ease;
        }
        nav a:hover { color: #ffffff; }
        nav a:hover::after { width: 100%; }

        .hero {
            max-width: 880px;
            margin: 0 auto;
            padding: 76px 24px 64px;
            text-align: center;
            animation: fadeUp 0.7s ease-out both;
        }
        .hero-logo {
            max-width: 100%;
            max-height: 130px;
            width: auto;
            height: auto;
            margin: 0 auto 24px;
            display: block;
            transition: transform 0.35s ease, filter 0.35s ease;
        }
        .hero-logo:hover {
            transform: scale(1.03);
            filter: drop-shadow(0 0 18px rgba(255, 42, 133, 0.28));
        }
        .role-bar {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #ff2a85;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff2a85;
            display: inline-block;
            animation: pulseDot 2s infinite;
        }
        .hero h1 {
            font-size: 1.95rem;
            font-weight: 700;
            max-width: 740px;
            margin: 0 auto 18px;
        }
        .hero p {
            color: #cfc8d8;
            font-size: 1.08rem;
            max-width: 640px;
            margin: 0 auto 28px;
        }

        .carry-scene {
            max-width: 440px;
            margin: 0 auto 28px;
            padding: 12px 16px;
            background: rgba(22, 17, 28, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }
        .carry-svg {
            width: 100%;
            height: 136px;
            display: block;
        }
        .carrier-group { animation: stairClimb 3.2s linear infinite; }
        .leg-left {
            transform-box: fill-box;
            transform-origin: center top;
            animation: stepLeft 0.4s ease-in-out infinite;
        }
        .leg-right {
            transform-box: fill-box;
            transform-origin: center top;
            animation: stepRight 0.4s ease-in-out infinite;
        }

        @keyframes stairClimb {
            0% { opacity: 0; transform: translate(0px, 0px); }
            10% { opacity: 1; transform: translate(15px, 0px); }
            25% { transform: translate(45px, 0px); }
            35% { transform: translate(65px, -18px); }
            50% { transform: translate(95px, -18px); }
            60% { transform: translate(115px, -36px); }
            75% { transform: translate(145px, -36px); }
            85% { opacity: 1; transform: translate(165px, -54px); }
            95% { opacity: 1; transform: translate(190px, -54px); }
            100% { opacity: 0; transform: translate(200px, -54px); }
        }
        @keyframes stepLeft {
            0%, 100% { transform: rotate(22deg); }
            50% { transform: rotate(-18deg); }
        }
        @keyframes stepRight {
            0%, 100% { transform: rotate(-18deg); }
            50% { transform: rotate(22deg); }
        }

        .cta-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
        }
        .btn {
            display: inline-block;
            padding: 13px 26px;
            background-color: #e6277a;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.25s ease;
        }
        .btn:hover {
            background-color: #ff2a85;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 42, 133, 0.35);
        }
        .btn:active { transform: translateY(0); }

        .btn-secondary {
            display: inline-block;
            padding: 13px 24px;
            background-color: transparent;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.25s ease;
        }
        .btn-secondary:hover {
            border-color: #ff2a85;
            color: #ff2a85;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 42, 133, 0.14);
        }
        .btn-secondary:active { transform: translateY(0); }

        .offer {
            max-width: 1060px;
            margin: 0 auto;
            padding: 20px 24px 72px;
            animation: fadeUp 0.8s ease-out 0.15s both;
        }
        .offer h2 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 32px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #16111c;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 26px 22px;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 42, 133, 0.45);
            background-color: #1b1423;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
        }
        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #ffffff;
            transition: color 0.25s ease;
        }
        .card:hover h3 { color: #ff2a85; }
        .card p { color: #c2bacd; font-size: 0.92rem; }

        .workflow-section {
            max-width: 1060px;
            margin: 0 auto 72px;
            padding: 0 24px;
            animation: fadeUp 0.8s ease-out 0.2s both;
        }
        .workflow-section h2 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 28px;
        }
        .steps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }
        .step-card {
            background-color: #16111c;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 22px 20px;
            position: relative;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }
        .step-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 42, 133, 0.4);
        }
        .step-num {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #ff2a85;
            background: rgba(255, 42, 133, 0.12);
            border: 1px solid rgba(255, 42, 133, 0.3);
            padding: 3px 9px;
            border-radius: 999px;
            margin-bottom: 12px;
        }
        .step-card h3 {
            font-size: 1.04rem;
            margin-bottom: 8px;
        }
        .step-card p {
            color: #c2bacd;
            font-size: 0.9rem;
        }

        .standards {
            max-width: 1060px;
            margin: 0 auto 72px;
            padding: 0 24px;
            animation: fadeUp 0.8s ease-out 0.25s both;
        }
        .standards-box {
            background-color: #16111c;
            border: 1px solid rgba(255, 42, 133, 0.25);
            border-radius: 8px;
            padding: 28px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            transition: border-color 0.25s ease;
        }
        .standards-box:hover { border-color: rgba(255, 42, 133, 0.5); }
        .standards-item strong {
            display: block;
            color: #ff2a85;
            font-size: 0.95rem;
            margin-bottom: 4px;
        }
        .standards-item span { color: #cfc8d8; font-size: 0.9rem; }

        .game-section {
            max-width: 1060px;
            margin: 0 auto 72px;
            padding: 0 24px;
        }
        .game-box {
            background-color: #16111c;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 28px 20px;
            text-align: center;
        }
        .game-box h2 { font-size: 1.4rem; margin-bottom: 8px; }
        .game-sub { color: #c2bacd; font-size: 0.92rem; margin-bottom: 18px; }
        .game-hud {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: #e6e1ec;
        }
        .game-hud strong { color: #ff2a85; }
        .level-tag {
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(255, 42, 133, 0.14);
            border: 1px solid rgba(255, 42, 133, 0.35);
            color: #ff77b1;
            font-weight: 600;
        }
        .game-reset {
            background: #231b2b;
            color: #ffffff;
            border: 1px solid rgba(255, 42, 133, 0.4);
            border-radius: 6px;
            padding: 6px 14px;
            cursor: pointer;
